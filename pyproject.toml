[project]
name = "xrplwatch"
version = "0.2.0"
description = "Listen to the XRP Ledger peer network directly."
requires-python = ">=3.11"
dependencies = [
    "pyopenssl>=24",   # lets us read the handshake values a server asks us to sign
    "coincurve>=19",   # signing, to prove we own the name we introduce ourselves with
    "xrpl-py>=3",      # the official library, used to decode transactions
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
